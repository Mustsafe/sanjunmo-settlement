// gap: 0px !important 및 position: fixed 로 본문 레이아웃 영향 100% 차단

function buildLockedSnbHtml(activeCode) {
  let groupsHtml = "";
  for (const g of MASTER_NAV_GROUPS) {
    groupsHtml += `  <div class="v4-snb-group-label">${g.groupTitle}</div>\n`;
    for (const item of g.items) {
      const isActive = item.code === activeCode ? " active" : "";
      const shortBadge = item.code === "WORKFLOW-GUIDE" ? "GUIDE" : item.code;
      groupsHtml += `  <button type="button" class="v4-snb-item${isActive}" onclick="window.location.href='${item.file}'">
    <span class="v4-snb-item-title">${item.title}</span>
    <span class="v4-snb-item-code">${shortBadge}</span>
  </button>\n`;
    }
  }

  return `<aside class="v4-master-snb" aria-label="산준모 정산 백오피스 표준 사이드바">
  <div class="v4-snb-brand" onclick="window.location.href='00_WORKFLOW_GUIDE_baseline.html'" title="전체 업무 플로우 가이드로 이동">
    <div class="v4-snb-brand-title">산준모 정산시스템</div>
    <div class="v4-snb-brand-sub">Settlement Backoffice · v4.0.0</div>
  </div>
${groupsHtml}  <div class="v4-snb-footer">
    <div class="v4-snb-footer-box">
      <strong>SSOT 정합성 기준</strong><br/>
      01 비즈니스 · 02 연산/세무<br/>
      03 화면/연동 · 04 QA 테스트
    </div>
  </div>
</aside>`;
}

function detectScreenCode(filename, content) {
  if (/00_WORKFLOW_GUIDE|index\.html/i.test(filename)) return "WORKFLOW-GUIDE";
  const m1 = filename.match(/ADMN-(INST|SETT|BOOK|USER|CONF)-\d{3}/i);
  if (m1) return m1[0].toUpperCase();
  if (/전체 업무 플로우 가이드/i.test(content) && !content.includes("ADMN-INST-001 ·")) return "WORKFLOW-GUIDE";
  const m2 = content.match(/ADMN-(INST|SETT|BOOK|USER|CONF)-\d{3}/);
  return m2 ? m2[0].toUpperCase() : "WORKFLOW-GUIDE";
}

function findMatchingCloseTag(html, startIdx, tagName) {
  const openRe = new RegExp(`<${tagName}\\b[^>]*>`, "gi");
  const closeRe = new RegExp(`</${tagName}\\s*>`, "gi");
  openRe.lastIndex = startIdx;
  const firstOpen = openRe.exec(html);
  if (!firstOpen || firstOpen.index !== startIdx) return -1;

  let depth = 1;
  let pos = openRe.lastIndex;
  while (depth > 0) {
    openRe.lastIndex = pos;
    closeRe.lastIndex = pos;
    const nextOpen = openRe.exec(html);
    const nextClose = closeRe.exec(html);
    if (!nextClose) return -1;
    if (nextOpen && nextOpen.index < nextClose.index) {
      depth++;
      pos = openRe.lastIndex;
    } else {
      depth--;
      pos = closeRe.lastIndex;
      if (depth === 0) return pos;
    }
  }
  return -1;
}

function replaceSnbBlock(html, newSnbHtml) {
  // 기존 class="snb" 또는 class="v4-master-snb" 모두 탐색
  const startRegex = /<(aside|nav|div)\b[^>]*\bclass\s*=\s*["'][^"']*\b(snb|v4-master-snb)\b[^"']*["'][^>]*>/i;
  const match = startRegex.exec(html);
  if (!match) return { html, replaced: false };

  const tagName = match[1].toLowerCase();
  const startIdx = match.index;
  const endIdx = findMatchingCloseTag(html, startIdx, tagName);
  if (endIdx === -1) return { html, replaced: false };

  const updated = html.slice(0, startIdx) + newSnbHtml + html.slice(endIdx);
  return { html: updated, replaced: true };
}

let processedFiles = [];

const dropzone = document.getElementById("dropzone");
dropzone.addEventListener("dragover", e => { e.preventDefault(); dropzone.classList.add("dragover"); });
dropzone.addEventListener("dragleave", () => dropzone.classList.remove("dragover"));
dropzone.addEventListener("drop", e => {
  e.preventDefault();
  dropzone.classList.remove("dragover");
  handleFiles(e.dataTransfer.files);
});

async function handleFiles(fileList) {
  processedFiles = [];
  for (const file of fileList) {
    if (!file.name.endsWith(".html")) continue;
    const raw = await file.text();
    const code = detectScreenCode(file.name, raw);

    let cleaned = raw
      .replace(/<style id="v4-std-snb-style">[\s\S]*?<\/style>/gi, "")
      .replace(/<style id="v4-master-snb-style">[\s\S]*?<\/style>/gi, "");

    const newSnb = buildLockedSnbHtml(code);
    const res = replaceSnbBlock(cleaned, newSnb);
    let outHtml = res.html;
    if (outHtml.includes("</head>")) {
      outHtml = outHtml.replace("</head>", LOCKED_SNB_CSS + "\n</head>");
    } else {
      outHtml = LOCKED_SNB_CSS + "\n" + outHtml;
    }

    const outName = code === "WORKFLOW-GUIDE"
      ? "00_WORKFLOW_GUIDE_baseline.html"
      : `${code}_baseline.html`;

    processedFiles.push({
      outName,
      code,
      replaced: res.replaced,
      content: outHtml
    });
  }
  renderList();
}

function renderList() {
  const box = document.getElementById("fileList");
  document.getElementById("btnDownloadAll").disabled = processedFiles.length === 0;
  box.innerHTML = processedFiles.map((f, idx) => `
    <div class="file-card">
      <div>
        <div class="file-name">${f.outName} <span style="color:#38bdf8;font-size:11.5px;">[${f.code}]</span></div>
        <div class="file-meta">${f.replaced ? "✔ 기존 .snb 클래스 분리 + gap:0px + position:fixed 고정 완료" : "⚠ SNB 영역 미발견"}</div>
      </div>
      <button class="btn-dl" onclick="downloadOne(${idx})">다운로드</button>
    </div>
  `).join("");
}

function downloadOne(idx) {
  const f = processedFiles[idx];
  const blob = new Blob([f.content], { type: "text/html;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = f.outName;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function downloadAll() {
  processedFiles.forEach((_, idx) => {
    setTimeout(() => downloadOne(idx), idx * 180);
  });
}
